name: FormFill test
on:
  push:
    branches: [excel-form-filler]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: chmod +x gradlew
      - run: ./gradlew :app:testDebugUnitTest --tests "*FormFillTest*" -i
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formfill-output
          path: |
            app/build/test-output/
            app/build/reports/tests/
